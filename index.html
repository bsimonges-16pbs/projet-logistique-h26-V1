<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WarehouseOps V2.4</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; margin:0; display:flex; }

/* SIDEBAR */
.sidebar {
  width:220px;
  background:#1e293b;
  color:white;
  padding:15px;
}

.menu {
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  cursor:pointer;
}

.menu:hover { background:#334155; }

/* CONTENT */
.content { flex:1; padding:20px; }

/* KPI */
.kpi { display:flex; gap:10px; }

.card {
  padding:15px;
  border-radius:10px;
  color:white;
  flex:1;
}

.blue { background:#3b82f6; }
.green { background:#22c55e; }
.red { background:#ef4444; }

/* TABLE */
table { width:100%; border-collapse: collapse; }
td, th { border:1px solid #ccc; padding:8px; text-align:center; }

.ok { color:green; font-weight:bold; }
.alert { color:red; font-weight:bold; }
</style>
</head>

<body>

<div class="sidebar">
<h2>WarehouseOps V2.4</h2>

<div class="menu" onclick="show('dashboard')">📊 Dashboard</div>
<div class="menu" onclick="show('articles')">📦 Articles</div>
<div class="menu" onclick="show('po')">🧾 Demandes</div>
<div class="menu" onclick="show('uml')">📐 UML</div>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<h1>📊 Dashboard</h1>

<div class="kpi">
<div class="card blue" id="kpi_total"></div>
<div class="card green" id="kpi_ok"></div>
<div class="card red" id="kpi_alert"></div>
</div>

<canvas id="chart"></canvas>
</div>

<!-- ARTICLES -->
<div id="articles" style="display:none">
<h1>📦 Articles (CRUD)</h1>

<input id="sku" placeholder="SKU">
<input id="stock" type="number" placeholder="Stock physique">
<input id="transit" type="number" placeholder="Transit">
<input id="reserve" type="number" placeholder="Réservé">
<input id="seuil" type="number" placeholder="Seuil minimum">

<button onclick="addArticle()">Ajouter</button>

<table>
<thead>
<tr>
<th>SKU</th><th>Stock</th><th>Transit</th><th>Réservé</th>
<th>Net</th><th>Seuil</th><th>Statut</th><th>Action</th>
</tr>
</thead>
<tbody id="articlesTable"></tbody>
</table>
</div>

<!-- PO -->
<div id="po" style="display:none">
<h1>🧾 Demandes d'achat</h1>

<table>
<thead>
<tr><th>SKU</th><th>Quantité suggérée</th><th>Status</th></tr>
</thead>
<tbody id="poTable"></tbody>
</table>
</div>

<!-- UML -->
<div id="uml" style="display:none">
<h1>📐 Processus UML</h1>

<p><b>AS-IS :</b> Manuel → erreurs → pas d’alerte</p>
<p><b>TO-BE :</b> Système → calcul automatique → alerte → PO</p>

<canvas id="umlCanvas" width="500" height="200"></canvas>
</div>

</div>

<script>

let articles = [];
let pos = [];

/* NAVIGATION */
function show(p){
  document.querySelectorAll(".content > div").forEach(d=>d.style.display="none");
  document.getElementById(p).style.display="block";
}

/* CALCUL BNMP */
function calcNet(a){
  return a.stock + a.transit - a.reserve;
}

/* STATUT */
function getStatus(a){
  return calcNet(a) < a.seuil ? "À commander" : "OK";
}

/* AJOUT ARTICLE */
function addArticle(){

  let a = {
    sku: sku.value,
    stock: Number(stock.value),
    transit: Number(transit.value),
    reserve: Number(reserve.value),
    seuil: Number(seuil.value)
  };

  articles.push(a);

  generatePO(a);

  render();
}

/* GENERATION PO */
function generatePO(a){
  let net = calcNet(a);

  if(net < a.seuil){
    pos.push({
      sku: a.sku,
      qty: (a.seuil - net) + 5,
      status: "Brouillon"
    });
  }
}

/* RENDER */
function render(){

  let html="";
  articles.forEach((a,i)=>{
    let net = calcNet(a);
    let st = getStatus(a);

    html += `
    <tr>
      <td>${a.sku}</td>
      <td>${a.stock}</td>
      <td>${a.transit}</td>
      <td>${a.reserve}</td>
      <td>${net}</td>
      <td>${a.seuil}</td>
      <td class="${st==='OK'?'ok':'alert'}">${st}</td>
      <td><button onclick="deleteArticle(${i})">X</button></td>
    </tr>`;
  });

  articlesTable.innerHTML = html;

  let poHTML="";
  pos.forEach(p=>{
    poHTML += `
    <tr>
      <td>${p.sku}</td>
      <td>${p.qty}</td>
      <td>${p.status}</td>
    </tr>`;
  });

  poTable.innerHTML = poHTML;

  updateKPI();
}

/* DELETE */
function deleteArticle(i){
  articles.splice(i,1);
  render();
}

/* KPI */
function updateKPI(){
  let total = articles.length;
  let ok = articles.filter(a=>getStatus(a)=="OK").length;
  let alert = total - ok;

  kpi_total.innerHTML = "Total: " + total;
  kpi_ok.innerHTML = "OK: " + ok;
  kpi_alert.innerHTML = "Alertes: " + alert;

  new Chart(document.getElementById("chart"),{
    type:"pie",
    data:{
      labels:["OK","À commander"],
      datasets:[{ data:[ok,alert] }]
    }
  });
}

/* UML DRAW */
function drawUML(){
  let ctx = document.getElementById("umlCanvas").getContext("2d");

  ctx.fillText("Magasinier → Saisie → Système → Calcul → Acheteur → PO", 20,100);
}
drawUML();

/* INIT */
render();

</script>

</body>
</html>
