<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Stock – Version Finale Excel</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; color: #333; }
    h1 { text-align: center; color: #1a73e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #1a73e8; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .kpi { display: flex; justify-content: space-around; margin-top: 20px; }
    .kpi div { background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    select { margin: 10px 0; padding: 5px; }
</style>
</head>
<body>

<h1>Dashboard Stock – Version Finale Excel</h1>

<div class="filters">
    <label>Filtrer par Classe:
        <select id="filterClasse">
            <option value="">Toutes</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>
    </label>
    <label>Filtrer par Statut Fournisseur:
        <select id="filterSupplier">
            <option value="">Tous</option>
            <option value="active">Actif</option>
            <option value="inactive">Inactif</option>
        </select>
    </label>
</div>

<div class="kpi">
    <div id="ruptureKPI">Ruptures: 0</div>
    <div id="serviceKPI">Service: 0%</div>
</div>

<table id="stockTable">
    <thead>
        <tr>
            <th>SKU</th>
            <th>Stock Physique</th>
            <th>En Transit</th>
            <th>Réservé</th>
            <th>Seuil Min</th>
            <th>Net Disponible</th>
            <th>Statut</th>
            <th>Suggestion</th>
            <th>Classe</th>
            <th>EOQ</th>
            <th>Fournisseur</th>
            <th>Status Fournisseur</th>
            <th>D</th>
            <th>Consommation</th>
            <th>S</th>
            <th>H</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// ===========================
// Exemple de dataset Excel
// Remplace par ton import réel
// ===========================
const excelData = [
    {
        sku: "SKU001", stock_physical: 50, in_transit: 20, reserved: 10, seuil_min: 40,
        net_available: 60, BNMP_message: "OK", qty_suggested: 20,
        ABC_class: "A", EOQ: 50, supplier_id: "F001", supplier_status: "active",
        annual_demand_D: 500, daily_consumption: 10, order_cost_S: 50, holding_cost_H: 5
    },
    {
        sku: "SKU002", stock_physical: 10, in_transit: 0, reserved: 5, seuil_min: 15,
        net_available: 5, BNMP_message: "ALERTE", qty_suggested: 50,
        ABC_class: "A", EOQ: 40, supplier_id: "F002", supplier_status: "inactive",
        annual_demand_D: 300, daily_consumption: 8, order_cost_S: 40, holding_cost_H: 4
    }
    // Ajoute toutes tes lignes Excel ici
];

// ===========================
// Mapping des données
// ===========================
function mapData(row) {
    return {
        sku: row.sku,
        stock: row.stock_physical,
        transit: row.in_transit,
        reserve: row.reserved,
        seuil: row.seuil_min,

        net: row.net_available,
        statut: row.BNMP_message,
        suggestion: row.qty_suggested,

        classe: row.ABC_class,
        eoq: row.EOQ,

        supplier: row.supplier_id,
        supplier_status: row.supplier_status,

        D: row.annual_demand_D,
        conso: row.daily_consumption,

        S: row.order_cost_S,
        H: row.holding_cost_H
    };
}

// ===========================
// Création PO (logique métier)
// ===========================
function createPO(article) {
    console.log(`PO créé pour SKU ${article.sku} — qty: ${article.suggestion}`);
}

// ===========================
// Traitement articles & KPI
// ===========================
function processArticles(articles) {
    articles.forEach(a => {
        if (a.classe === "A" && a.net < a.seuil && a.supplier_status === "active") {
            createPO(a);
        }
    });

    // KPI
    const rupture = articles.filter(a => a.net < 0).length;
    const service = articles.filter(a => a.statut === "OK").length / articles.length;

    document.getElementById("ruptureKPI").innerText = `Ruptures: ${rupture}`;
    document.getElementById("serviceKPI").innerText = `Service: ${(service*100).toFixed(2)}%`;

    displayTable(articles);
}

// ===========================
// Affichage tableau filtrable
// ===========================
function displayTable(articles) {
    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    const filterClasse = document.getElementById("filterClasse").value;
    const filterSupplier = document.getElementById("filterSupplier").value;

    const filtered = articles.filter(a => 
        (filterClasse === "" || a.classe === filterClasse) &&
        (filterSupplier === "" || a.supplier_status === filterSupplier)
    );

    filtered.forEach(a => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${a.sku}</td>
            <td>${a.stock}</td>
            <td>${a.transit}</td>
            <td>${a.reserve}</td>
            <td>${a.seuil}</td>
            <td>${a.net}</td>
            <td>${a.statut}</td>
            <td>${a.suggestion}</td>
            <td>${a.classe}</td>
            <td>${a.eoq}</td>
            <td>${a.supplier}</td>
            <td>${a.supplier_status}</td>
            <td>${a.D}</td>
            <td>${a.conso}</td>
            <td>${a.S}</td>
            <td>${a.H}</td>
        `;
        tbody.appendChild(tr);
    });
}

// ===========================
// Filtrage dynamique
// ===========================
document.getElementById("filterClasse").addEventListener("change", () => displayTable(mappedData));
document.getElementById("filterSupplier").addEventListener("change", () => displayTable(mappedData));

// ===========================
// Initialisation
// ===========================
const mappedData = excelData.map(mapData);
processArticles(mappedData);

</script>

</body>
</html>
