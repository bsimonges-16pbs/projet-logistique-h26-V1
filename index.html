<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>WarehouseOps</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
}

.version-bar{
margin-top:10px;
}

.container{
padding:20px;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.kpi{
padding:20px;
border-radius:10px;
color:white;
text-align:center;
}

.kpi-total{background:#3498db;}
.kpi-rupture{background:#e74c3c;}
.kpi-surstock{background:#f39c12;}
.kpi-commandes{background:#27ae60;}

.kpi h2{
margin:0;
font-size:32px;
}

.controls{
display:flex;
gap:15px;
margin-bottom:20px;
}

input,select{
padding:8px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#34495e;
color:white;
cursor:pointer;
}

.status-ok{color:green;font-weight:bold;}
.status-risk{color:red;font-weight:bold;}
.status-surstock{color:#e67e22;font-weight:bold;}

</style>
</head>

<body>

<header>

<h1>WarehouseOps Dashboard</h1>

<div class="version-bar">

Version actuelle :

<select id="versionSelect">

<option>V1.1</option>
<option>V1.0</option>

</select>

</div>

</header>

<div class="container">

<div class="controls">

<input type="file" id="excelFile">

<input type="text" id="searchBox" placeholder="Rechercher SKU ou produit">

<select id="categoryFilter">
<option value="all">Toutes catégories</option>
</select>

</div>

<div class="kpi-grid">

<div class="kpi kpi-total">
<h2 id="totalSKU">0</h2>
<p>Total SKU</p>
</div>

<div class="kpi kpi-rupture">
<h2 id="rupture">0</h2>
<p>Ruptures</p>
</div>

<div class="kpi kpi-surstock">
<h2 id="surstock">0</h2>
<p>Surstock</p>
</div>

<div class="kpi kpi-commandes">
<h2 id="commandes">0</h2>
<p>À commander</p>
</div>

</div>

<table id="inventoryTable">

<thead>

<tr>

<th onclick="sortTable(0)">SKU</th>
<th>Description</th>
<th>Catégorie</th>
<th onclick="sortTable(3)">Stock</th>
<th onclick="sortTable(4)">Reorder</th>
<th>EOQ</th>
<th>Status</th>
<th>Quantité suggérée</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<script>

let globalData=[]

document.getElementById("excelFile").addEventListener("change",loadFile)
document.getElementById("searchBox").addEventListener("input",filterTable)
document.getElementById("categoryFilter").addEventListener("change",filterTable)

function loadFile(e){

const file=e.target.files[0]
const reader=new FileReader()

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result)
const workbook=XLSX.read(data,{type:'array'})
const sheet=workbook.Sheets[workbook.SheetNames[0]]

globalData=XLSX.utils.sheet_to_json(sheet)

populateCategories()

processData(globalData)

}

reader.readAsArrayBuffer(file)

}

function populateCategories(){

let categories=[...new Set(globalData.map(i=>i.category))]

let select=document.getElementById("categoryFilter")

categories.forEach(c=>{

let option=document.createElement("option")

option.value=c
option.text=c

select.appendChild(option)

})

}

function processData(data){

let rupture=0
let surstock=0
let commandes=0

const tbody=document.querySelector("#inventoryTable tbody")
tbody.innerHTML=""

data.forEach(item=>{

let stock=item.stock_physical||0
let reorder=item.reorder_point||0
let eoq=item.EOQ||0
let suggested=item.qty_suggested||0

let status="OK"
let className="status-ok"

if(stock<reorder){

status="RUPTURE / COMMANDER"
className="status-risk"
rupture++
commandes++

}

else if(stock>eoq*2){

status="SURSTOCK"
className="status-surstock"
surstock++

}

let row=document.createElement("tr")

row.innerHTML=`

<td>${item.sku}</td>
<td>${item.description}</td>
<td>${item.category}</td>
<td>${stock}</td>
<td>${reorder}</td>
<td>${eoq}</td>
<td class="${className}">${status}</td>
<td>${suggested}</td>

`

tbody.appendChild(row)

})

document.getElementById("totalSKU").innerText=data.length
document.getElementById("rupture").innerText=rupture
document.getElementById("surstock").innerText=surstock
document.getElementById("commandes").innerText=commandes

}

function filterTable(){

let search=document.getElementById("searchBox").value.toLowerCase()
let category=document.getElementById("categoryFilter").value

let filtered=globalData.filter(item=>{

let matchSearch=(item.sku+" "+item.description+" "+item.category).toLowerCase().includes(search)

let matchCategory=(category==="all"||item.category===category)

return matchSearch&&matchCategory

})

processData(filtered)

}

function sortTable(col){

let table=document.getElementById("inventoryTable")
let rows=Array.from(table.rows).slice(1)

rows.sort((a,b)=>{

return a.cells[col].innerText.localeCompare(b.cells[col].innerText)

})

rows.forEach(r=>table.appendChild(r))

}

</script>

</body>
</html>
