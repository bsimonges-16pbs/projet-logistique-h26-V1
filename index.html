<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SIAG - Dashboard Avancé</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family:Segoe UI; margin:0; background:#f5f7fa;}
header {background:linear-gradient(90deg,#2c3e50,#3498db);color:white;padding:15px;text-align:center;}
nav {display:flex;background:#2c3e50;}
nav button {flex:1;padding:15px;border:none;color:white;background:#2c3e50;cursor:pointer;}
nav button:hover {background:#34495e;}
.container {padding:20px;}
.card {background:white;padding:15px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.ok{color:#2ecc71;font-weight:bold;}
.alert{color:#e74c3c;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
.kpi{padding:20px;border-radius:10px;color:white;text-align:center;}
.kpi1{background:#3498db;}
.kpi2{background:#e74c3c;}
.kpi3{background:#2ecc71;}
</style>
</head>

<body>

<header>
<h1>📊 SIAG - Pilotage Performance</h1>
</header>

<nav>
<button onclick="showTab('dashboard')">Dashboard</button>
<button onclick="showTab('trs')">TRS</button>
<button onclick="showTab('abc')">ABC / EOQ</button>
</nav>

<div class="container">

<!-- DASHBOARD KPI -->
<div id="dashboard" class="tab">
<div class="grid">

<div class="kpi kpi1">
<h2 id="total"></h2>
<p>Total SKU</p>
</div>

<div class="kpi kpi2">
<h2 id="rupture"></h2>
<p>Ruptures</p>
</div>

<div class="kpi kpi3">
<h2 id="service"></h2>
<p>Taux Service</p>
</div>

</div>

<div class="card">
<canvas id="kpiChart"></canvas>
</div>
</div>

<!-- TRS -->
<div id="trs" class="tab" style="display:none;">
<div class="card">

<h3>Calcul TRS</h3>

<input id="tp" placeholder="Temps planifié">
<input id="arret" placeholder="Arrêts">
<input id="cadence" placeholder="Cadence/h">
<input id="qt" placeholder="Quantité totale">
<input id="qb" placeholder="Quantité bonne">

<button onclick="calcTRS()">Calculer</button>

<p id="trsResult"></p>

</div>
</div>

<!-- ABC -->
<div id="abc" class="tab" style="display:none;">
<div class="card">
<h3>ABC + EOQ</h3>

<table id="abcTable">
<thead>
<tr><th>SKU</th><th>Valeur</th><th>Classe</th><th>EOQ</th></tr>
</thead>
<tbody></tbody>
</table>

</div>
</div>

</div>

<script>

// DATA
let data = [
{sku:"A", stock:50, transit:10, reserve:20, seuil:30, cost:10, demand:500, S:50, H:2},
{sku:"B", stock:10, transit:0, reserve:20, seuil:15, cost:20, demand:200, S:40, H:3},
{sku:"C", stock:80, transit:10, reserve:10, seuil:40, cost:5, demand:800, S:30, H:1}
];

function net(a){return a.stock+a.transit-a.reserve;}

function computeKPI(){

let rupture=0, service=0;

data.forEach(a=>{
if(net(a)<0) rupture++;
if(net(a)>=a.seuil) service++;
});

total.innerText=data.length;
ruptureEl.innerText=rupture;
service.innerText=Math.round(service/data.length*100)+"%";

drawChart(rupture);
}

function drawChart(r){
new Chart(kpiChart,{
type:"bar",
data:{
labels:["OK","Rupture"],
datasets:[{data:[data.length-r,r]}]
}
});
}

function calcTRS(){

let tp=+tp.value;
let ar=+arret.value;
let cad=+cadence.value;
let qt=+qt.value;
let qb=+qb.value;

let dispo=(tp-ar)/tp;
let perf=qt/(cad*(tp-ar));
let qual=qb/qt;

let trs=dispo*perf*qual;

trsResult.innerHTML="TRS = "+(trs*100).toFixed(2)+"%";
}

function computeABC(){

let totalVal=0;

data.forEach(a=>{
a.value=a.cost*a.demand;
totalVal+=a.value;
});

data.sort((a,b)=>b.value-a.value);

let cum=0;

data.forEach(a=>{
cum+=a.value/totalVal;

if(cum<=0.8) a.class="A";
else if(cum<=0.95) a.class="B";
else a.class="C";

a.eoq=Math.sqrt((2*a.demand*a.S)/a.H).toFixed(0);
});

let html="";

data.forEach(a=>{
html+=`<tr>
<td>${a.sku}</td>
<td>${a.value}</td>
<td>${a.class}</td>
<td>${a.eoq}</td>
</tr>`;
});

abcTable.querySelector("tbody").innerHTML=html;

}

function showTab(id){
document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
document.getElementById(id).style.display="block";
}

computeKPI();
computeABC();

</script>

</body>
</html>
